[package]
name = "thunderboard"
version = "0.1.0"
description = "A Fluent soundboard with pitch-shifting hotkeys"
authors = ["DavidMGDev"]
edition = "2021"

[lib]
name = "thunderboard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rodio = { version = "0.22", features = ["symphonia-all"] }
tauri-plugin-dialog = "2.7.3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    # ShowWindow / SetForegroundWindow. These resolve today only because a
    # dependency happens to enable the feature; ask for it ourselves.
    "Win32_UI_WindowsAndMessaging",
    # MapVirtualKeyExW / GetKeyboardLayout, for resolving a physical key to the
    # virtual key the user's actual keyboard layout gives it.
    "Win32_UI_Input_KeyboardAndMouse",
] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
